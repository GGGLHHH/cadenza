name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before linting, not after: the packages resolve each other through their
      # `exports`, so `@gedatou/cadenza-utils` has no types until it is built —
      # and type-aware lint reports every value that flows from it as `error`
      # typed. On a fresh checkout that is ~180 phantom errors.
      - name: Build packages
        run: pnpm --filter "@gedatou/*" run build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test run

      - name: Build docs
        run: pnpm --filter docs run build
