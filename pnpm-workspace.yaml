catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - bumpp@12.0.0
  - '@vitejs/plugin-react@6.0.5'
shellEmulator: true
trustPolicy: no-downgrade
# semver@6.3.1 (published 2023-07-10) lost provenance relative to earlier releases.
# Reached only via @babel/core <- @vitejs/plugin-react, which React needs.
trustPolicyExclude:
  - semver@6.3.1

packages:
  - docs
  - packages/*

catalogs:
  cli:
    '@antfu/eslint-config': ^9.1.0
    '@antfu/ni': ^30.2.0
    bumpp: ^12.0.0
    eslint: ^10.7.0
    nano-staged: ^1.0.2
    publint: ^0.3.21
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.12
    tsx: ^4.23.1
    typescript: ^6.0.3
  docs:
    '@astrojs/react': ^6.0.0
    '@astrojs/starlight': ^0.41.0
    '@astrojs/starlight-tailwind': ^5.0.0
    astro: ^7.1.0
  react:
    react: ^19.2.0
    react-dom: ^19.2.0
  testing:
    '@testing-library/react': ^16.3.2
    '@testing-library/user-event': ^14.6.1
    '@vitejs/plugin-react': ^6.0.5
    jsdom: ^30.0.1
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.1
    '@types/react': ^19.2.0
    '@types/react-dom': ^19.2.0
  ui:
    '@tabler/icons-react': ^3.46.0
    '@tailwindcss/vite': ^4.3.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    react-aria-components: ^1.19.0
    tailwind-merge: ^3.6.0
    tailwindcss: ^4.3.0
    tw-animate-css: ^1.4.0
allowBuilds:
  esbuild: true
  simple-git-hooks: true
