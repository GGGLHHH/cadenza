catalogMode: prefer
ignoreWorkspaceRootCheck: true
# 关掉发布冷却期。原先靠 minimumReleaseAgeExclude 逐版本开洞,每次升级都要回来补版本号,
# 漏补的症状是「新发布的库版本装不下来」。设成 0 后那份枚举成了不可达配置,一并删掉。
# 代价:冷却期本是防「刚发布的恶意/被劫持版本」的供应链缓冲,关掉等于对所有依赖都不再等。
# 要收回来就改成分钟数(如 1440),届时需重新用 minimumReleaseAgeExclude 开洞——该字段只吃精确版本,没有通配写法。
minimumReleaseAge: 0
shellEmulator: true
trustPolicy: no-downgrade
# semver@6.3.1 (published 2023-07-10) lost provenance relative to earlier releases.
# Reached only via @babel/core <- @vitejs/plugin-react, which React needs.
trustPolicyExclude:
  - semver@6.3.1
  # reselect@5.1.1 (published 2024-06-01) likewise lost provenance.
  # Reached only via recharts, which the chart component needs.
  - reselect@5.1.1

packages:
  - docs
  - packages/*

# Astro's remark/rehype chain pulls both 3.0.4 and 3.0.5, and two copies of a
# structural type do not unify — docs typecheck fails on Root vs Root. Types only,
# so pinning one copy is free.
overrides:
  '@types/hast': ^3.0.5

catalogs:
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@antfu/ni': ^30.5.0
    '@eslint-react/eslint-plugin': ^5.18.3
    bumpp: ^12.2.0
    eslint: ^10.8.1
    eslint-plugin-better-tailwindcss: ^4.7.0
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.3
    nano-staged: ^1.0.2
    publint: ^0.3.23
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    tsx: ^4.23.11
    typescript: ^6.0.3
  docs:
    '@orama/tokenizers': ^3.1.18
    '@types/mdx': ^2.0.14
    fumadocs-core: ^16.14.2
    fumadocs-mdx: ^15.2.2
    next: ^16.3.0
    rehype-pretty-code: ^0.14.5
    shiki: ^4.4.2
    zod: ^4.4.3
  react:
    react: ^19.2.8
    react-dom: ^19.2.8
  testing:
    '@testing-library/react': ^16.3.2
    '@testing-library/user-event': ^14.6.3
    '@vitejs/plugin-react': ^6.0.5
    jsdom: ^30.0.1
    vitest: ^4.1.10
  types:
    '@types/lodash': ^4.17.25
    '@types/node': ^26.2.0
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
  ui:
    '@base-ui/react': ^1.7.0
    '@shadcn/react': ^0.2.1
    '@tabler/icons-react': ^3.46.0
    '@tailwindcss/postcss': ^4.3.3
    '@tanstack/react-form': ^1.33.4
    '@tanstack/react-virtual': ^3.14.9
    ahooks: ^3.9.7
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    cmdk: ^1.1.1
    date-fns: ^4.4.0
    embla-carousel-react: ^8.6.0
    input-otp: ^1.4.2
    motion: ^13.1.0
    next-themes: ^0.4.6
    react-aria-components: ^1.20.0
    react-day-picker: ^10.0.1
    react-resizable-panels: ^4.12.2
    recharts: 3.8.0
    sonner: ^2.0.7
    tailwind-merge: ^3.6.0
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
