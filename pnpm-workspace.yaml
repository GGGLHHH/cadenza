catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - bumpp@12.0.0
  - '@vitejs/plugin-react@6.0.5'
  - '@eslint-react/ast@5.18.1'
  - '@eslint-react/core@5.18.1'
  - '@eslint-react/eslint-plugin@5.18.1'
  - '@eslint-react/eslint@5.18.1'
  - '@eslint-react/jsx@5.18.1'
  - '@eslint-react/shared@5.18.1'
  - '@eslint-react/var@5.18.1'
  - eslint-plugin-react-dom@5.18.1
  - eslint-plugin-react-jsx@5.18.1
  - eslint-plugin-react-naming-convention@5.18.1
  - eslint-plugin-react-rsc@5.18.1
  - eslint-plugin-react-web-api@5.18.1
  - eslint-plugin-react-x@5.18.1
shellEmulator: true
trustPolicy: no-downgrade
# semver@6.3.1 (published 2023-07-10) lost provenance relative to earlier releases.
# Reached only via @babel/core <- @vitejs/plugin-react, which React needs.
trustPolicyExclude:
  - semver@6.3.1
  # reselect@5.1.1 (published 2024-06-01) likewise lost provenance.
  # Reached only via recharts, which the chart component needs.
  - reselect@5.1.1

packages:
  - docs
  - packages/*

# Astro's remark/rehype chain pulls both 3.0.4 and 3.0.5, and two copies of a
# structural type do not unify — docs typecheck fails on Root vs Root. Types only,
# so pinning one copy is free.
overrides:
  '@types/hast': ^3.0.5

catalogs:
  cli:
    '@antfu/eslint-config': ^9.2.0
    '@antfu/ni': ^30.3.0
    '@eslint-react/eslint-plugin': ^5.18.1
    bumpp: ^12.1.1
    eslint: ^10.8.0
    eslint-plugin-better-tailwindcss: ^4.7.0
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.3
    nano-staged: ^1.0.2
    publint: ^0.3.22
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.14
    tsx: ^4.23.1
    typescript: ^6.0.3
  docs:
    '@astrojs/react': ^6.0.2
    '@astrojs/starlight': ^0.41.5
    '@astrojs/starlight-tailwind': ^5.0.0
    astro: ^7.1.6
  react:
    react: ^19.2.8
    react-dom: ^19.2.8
  testing:
    '@testing-library/react': ^16.3.2
    '@testing-library/user-event': ^14.6.1
    '@vitejs/plugin-react': ^6.0.5
    jsdom: ^30.0.1
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.2
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
  ui:
    '@base-ui/react': ^1.6.0
    '@react-types/shared': ^3.36.0
    '@shadcn/react': ^0.2.1
    '@tabler/icons-react': ^3.46.0
    '@tailwindcss/vite': ^4.3.3
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    embla-carousel-react: ^8.6.0
    input-otp: ^1.4.2
    next-themes: ^0.4.6
    react-aria-components: ^1.19.0
    react-resizable-panels: ^4.12.2
    recharts: 3.8.0
    sonner: ^2.0.7
    tailwind-merge: ^3.6.0
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
allowBuilds:
  esbuild: true
  simple-git-hooks: true
